# Betrieb mit Datenbank, Anwendungsdienst und vorgelagertem Reverse Proxy
# (Spec §12). `docker compose up` startet die Anwendung vollständig inklusive
# Datenbankmigration (NFA-BETR-01).
#
# Seit M17 gehört PostgreSQL dazu. Die Einzelplatzinstallation behält damit ihr
# Versprechen — ein Befehl, und es läuft —, obwohl die Anwendung jetzt auch mit
# mehreren Instanzen gegen eine gemeinsame Datenbank laufen kann. Wer eine
# verwaltete Datenbank beim Hoster benutzt, setzt `DATABASE_URL` in der `.env`
# und lässt diesen Dienst weg.

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: faktura
      POSTGRES_USER: faktura
      # Aus der `.env`; ohne gesetzten Wert startet der Dienst nicht. Ein
      # Vorgabepasswort hier wäre eines, das jede Installation teilt.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Kein `ports`: Die Datenbank ist ausschließlich im internen Netz
    # erreichbar, nie vom Host und nie aus dem Internet (NFA-SEC-19).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U faktura -d faktura']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Im Container gilt der Dienstname aus diesem Netz — unabhängig davon,
      # was für die lokale Entwicklung in .env steht.
      DATABASE_URL: postgresql://faktura:${POSTGRES_PASSWORD}@db:5432/faktura?schema=public
      NODE_ENV: production
      PORT: 3000
      STORAGE_DIR: /app/storage
      BACKUP_DIR: /app/backups
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      # Sicherungen (NFA-BETR-03). Der Auftrag `npm run backup` schreibt
      # hierher; die Zeitsteuerung liegt beim Server, nicht in der Anwendung.
      - ./backups:/app/backups
    # Chromium rendert **ohne** `--no-sandbox` (Spec §11.3). Seine Sandbox legt
    # dafür Namespaces an und wechselt den Benutzer; unter dem
    # Standard-Seccomp-Filter von Docker geht das nur mit CAP_SYS_ADMIN.
    #
    # Statt sie einfach zu **ergänzen**, wird zuerst alles abgeworfen und dann
    # genau das zurückgegeben, was die Sandbox braucht. Ermittelt durch
    # Ausprobieren am Image: ohne SYS_CHROOT scheitert sie an
    # `sys_chroot("/proc/self/fdinfo/")`, ohne SETUID/SETGID am Benutzerwechsel.
    # Unterm Strich trägt der Dienst damit **vier** Capabilities statt der
    # vierzehn, die Docker voreinstellt — weniger als vorher, nicht mehr.
    #
    # Der Anwendungsprozess selbst hat davon nichts: Er läuft als `node` mit
    # leerer effektiver Menge (`CapEff: 0000…0`). Erreichbar sind die vier
    # ausschließlich über das setuid-Hilfsprogramm `chrome-sandbox`, dessen
    # einzige Aufgabe es ist, die Sandbox aufzuspannen und die Rechte sofort
    # wieder abzugeben.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - SYS_CHROOT
    # Chromium legt seine geteilten Speicherbereiche unter /dev/shm ab; die
    # voreingestellten 64 MB reichen für mehrseitige Belege nicht.
    shm_size: 256m

    # Bewusst ohne `ports`: Der Anwendungsdienst ist ausschließlich im internen
    # Netz erreichbar, nie direkt vom Host oder aus dem Internet (NFA-SEC-19).
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Der Renderdienst (M17, B3) — **auskommentiert und bewusst so**.
  #
  # Eine Einzelplatzinstallation braucht ihn nicht: Dort setzt die Anwendung im
  # eigenen Prozess, und der Container traegt die vier Faehigkeiten, die
  # Chromium fuer seine Sandbox braucht.
  #
  # Noetig wird er dort, wo eine Anwendungsinstanz diese Faehigkeiten **nicht**
  # bekommen kann — etwa unter einem strengen Sicherheitsprofil in Kubernetes.
  # Dann traegt sie der Renderdienst, und die Instanzen laufen ohne
  # Sonderrechte. Wer ihn einschaltet, setzt in der `.env`:
  #
  #   RENDERER_URL=http://renderer:3900
  #   RENDERER_TOKEN=<mindestens 16 Zeichen>
  #
  # und entfernt beim `app`-Dienst `cap_add` sowie `shm_size`.
  #
  # renderer:
  #   build:
  #     context: .
  #   restart: unless-stopped
  #   command: ['node', 'dist/renderer-server.mjs']
  #   environment:
  #     RENDERER_PORT: 3900
  #     RENDERER_TOKEN: ${RENDERER_TOKEN}
  #   expose:
  #     - '3900'
  #   cap_drop: [ALL]
  #   cap_add: [SYS_ADMIN, SETUID, SETGID, SYS_CHROOT]
  #   shm_size: 256m
  #   healthcheck:
  #     test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3900/health', { headers: { authorization: `Bearer ${process.env.RENDERER_TOKEN}` } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  # Ein benanntes Volume statt eines Bind-Mounts: PostgreSQL verlangt
  # Eigentümerschaft und Rechte an seinem Datenverzeichnis, und die sind über
  # einen Bind-Mount je nach Wirtssystem nicht herstellbar. Gesichert wird
  # ohnehin nicht mehr durch Kopieren des Verzeichnisses, sondern mit `pg_dump`
  # (siehe README, Abschnitt „Sicherung").
  db_data:
