apiVersion: v1
kind: Secret
metadata:
  name: faktura-postgres
  namespace: faktura
type: Opaque
stringData:
  POSTGRES_DB: faktura
  POSTGRES_USER: faktura
  POSTGRES_PASSWORD: faktura-dev-password

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faktura-postgres-data
  namespace: faktura
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: faktura-postgres
  namespace: faktura
spec:
  serviceName: faktura-postgres
  replicas: 1

  selector:
    matchLabels:
      app: faktura-postgres

  template:
    metadata:
      labels:
        app: faktura-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: faktura-postgres

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - faktura
                - -d
                - faktura
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - faktura
                - -d
                - faktura
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: faktura-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: faktura-postgres
  namespace: faktura
spec:
  type: ClusterIP

  selector:
    app: faktura-postgres

  ports:
    - port: 5432
      targetPort: 5432